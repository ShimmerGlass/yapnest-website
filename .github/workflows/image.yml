# On a v* tag: build the Dockerfile for amd64 and push it to the repository's GitHub Container Registry package as
# :<tag> and :latest. The Dockerfile runs its checks in a stage the final image depends on, so a failing check fails
# the push. The job summary ends with the pushed digest.
name: image
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The registry wants the image name in lower case, and the owner's name isn't.
      - name: name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"
      - name: push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
            ${{ steps.name.outputs.image }}:latest
      - name: digest
        run: echo "pushed ${{ steps.name.outputs.image }}:${{ github.ref_name }}@${{ steps.push.outputs.digest }} (and :latest)" | tee -a "$GITHUB_STEP_SUMMARY"
