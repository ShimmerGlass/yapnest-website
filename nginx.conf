# The unprivileged image runs nginx as the nginx user, so everything it writes goes to /tmp and it listens on 8080.
# Scaleway terminates TLS and redirects HTTP to HTTPS before a request reaches this container, but its edge can't add
# headers or redirect by host, so the image sends Strict-Transport-Security and redirects www itself. Browsers only
# ever reach this origin through the proxy's HTTPS, so the header is always seen over a secure connection.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;
    sendfile on;

    # No access log. The privacy policy says nothing about visitors to the site, so it keeps no IP addresses or
    # request records. Errors still go to stderr, without client addresses beyond what nginx puts in an error line.
    access_log off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css image/svg+xml;  # text/html is always compressed

    # The proxy may pass the custom domain in Host or in X-Forwarded-Host, and it is not known which, so either one
    # naming www counts. The regexes are case-insensitive because X-Forwarded-Host arrives as the client wrote it.
    map "$host|$http_x_forwarded_host" $www_host {
        default 0;
        "~*^www\.yapnest\.fr\|" 1;
        "~*\|www\.yapnest\.fr$" 1;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        charset utf-8;
        # Not the image's html folder, so its stock pages are never served.
        root /srv/site;

        # Redirects are relative, so they keep working behind a proxy that hides the public host and scheme. The www
        # redirect is the exception and spells out its target, as the proxy's host is what it has to get away from.
        absolute_redirect off;

        # Every header is set here and none in a location: add_header in a location would drop these.
        add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        # No includeSubDomains, as push.yapnest.fr is not a website, and no preload.
        add_header Strict-Transport-Security "max-age=63072000" always;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # After the 405 check, so a POST to www is refused rather than redirected into a GET. Being in the server
        # block, the redirect carries the headers above like any other response.
        if ($www_host) {
            return 301 https://yapnest.fr$request_uri;
        }

        error_page 404 /404.html;

        # The URLs the app opens are /privacy, /terms and /support, so those are the canonical forms. The folder
        # forms redirect to them, and the pages are served from their folders' index.html.
        location ~ ^/(privacy|terms|support|legal)/(index\.html)?$ {
            return 301 /$1;
        }
        location ~ ^/(?<page>privacy|terms|support|legal)$ {
            try_files /$page/index.html =404;
            expires 5m;
        }
        location = /index.html {
            return 301 /;
        }
        location = / {
            try_files /index.html =404;
            expires 5m;
        }

        location ~ \.(css|svg)$ {
            try_files $uri =404;
            expires 1d;
        }

        # Only reached through error_page. A direct request for it is a plain 404 like any other missing page.
        location = /404.html {
            internal;
            expires 5m;
        }

        # For the container's healthcheck.
        location = /healthz {
            default_type text/plain;
            expires -1;
            return 200 "ok\n";
        }

        location / {
            try_files $uri =404;
        }
    }
}
